[project]
name = "junction-qec-pipeline"
version = "0.1.0"
description = "Modular QEC logical-error-rate pipeline for the IQM challenge."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Scripts add the repo root to sys.path before importing qec_pipeline.
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
