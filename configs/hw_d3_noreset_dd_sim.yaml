# Hardware-ready d3 surface-code memory on IQM Emerald (simulator twin).
# Design (see docs/HARDWARE_RUNBOOK.md):
# - code.mid_circuit_reset: none -> one multiplexed readout per round, no reset pulse;
#   detectors compare ancilla outcomes two rounds apart (Gehér et al., arXiv:2408.00758).
# - grouped readout, active reset between shots, IQM native dynamical decoupling.
# - calibration fetched 2026-10-04 (scripts/fetch_calibration.py); patch is still the best native d3 patch.
# - noise: two_qubit_scale 1.5 fitted to r=1 hardware; round 1.29 us measured with Pulla.
#
# Run:
#   python scripts/sweep_rounds.py configs/hw_d3_noreset_dd_sim.yaml --rounds 1 9 5

experiment:
  name: hw_d3_noreset_dd_sim
  description: d3 memory, no mid-circuit reset, DD, active reset between shots, Oct
    2026 calibration.
  seed: 1
code:
  family: surface_code_iqm
  distance: 3
  rounds: 1
  basis: both
  mid_circuit_reset: none
backend:
  name: simulator
  shots: 2000
  options:
    seed: 1
noise:
  model: iqm_calibration
  calibration_file: configs/calibration/emerald_2026-10-04T05_09_03Z.json
  options:
    apply_idle: true
    route_error_multiplier: 1.0
    two_qubit_scale: 1.5
    round_duration_s: 1.29e-06
    idle_t2: echo
decoder:
  name: pymatching_calibrated
  options: {}
mapping:
  strategy: calibration_best_patch
  calibration_file: configs/calibration/emerald_2026-10-04T05_09_03Z.json
  weights:
    one_qubit: 1.0
    two_qubit: 1.0
    measurement: 1.0
    reset: 1.0
    idle: 1.0
    qnd: 1.0
    max_coupler: 10.0
  options:
    exclude_qubits:
    - QB9
    - QB25
    - QB41
    - QB46
    - QB47
  hardware_patch:
    stim_to_hardware:
      '1': QB31
      '2': QB39
      '3': QB38
      '5': QB45
      '8': QB22
      '9': QB30
      '10': QB29
      '11': QB37
      '12': QB36
      '13': QB44
      '14': QB14
      '15': QB13
      '16': QB21
      '17': QB20
      '18': QB28
      '19': QB27
      '25': QB19
artifacts:
  root: results
  save_raw_measurements: true
  save_syndromes: true
  save_report: true
